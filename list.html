<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Unordered List</h1>

    <ul type="square">
        <li>apple</li>
        <li>banana</li>
        <li>orange</li>
    </ul>

    <h1>Ordered List</h1>

    <ol type="A" start="19" reverse>
        <li>sam</li>
        <li>sneha</li>
        <li>palki</li>
    </ol>

    <h1>Description List</h1>
<!-- dl description list
dt description term
dd description details 
it do  not have any attribute-->
    <dl>
        <dt>WHO</dt>
        <dd>world health organisation</dd>
        <dt>WWW</dt>
        <dd>world wide web</dd>
        <dt>ui</dt>
        <dd>user interface</dd>
    </dl>
</body>
</html>

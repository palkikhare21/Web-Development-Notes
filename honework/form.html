<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>form</legend>
        <h1>FORM</h1>
    <form action="">
        <label for="">department</label>

        <select name="" id="" multiple>
            <option value="">CSE</option>
            <option value="">ECE</option>
            <option value="" selected>ME</option>
        </select>
        <br>
        <label for="">course</label>
        <select>
            <optgroup label="CSE">
               <option value="">Data Structure</option>
               <option value="">opps</option>
            </optgroup>     
        
            <optgroup label="ECE">
               <option value="">Signals and Systems</option>
               <option value="">Operating Systems</option>
            </optgroup>     
     
            <optgroup label="ME">
               <option value="">Mechanics</option>
               <option value="">Thermodynamics</option>
            </optgroup>     
         </select>


         <label for="">value</label>
            <input list="courses" name="course" id="course" list="courses" placeholder="select your course">

            <datalist id="courses">
                <option value="hypertext language">html</option>
            <option value="stylesheet">css</option>
         </datalist>
         <br>
         <label for="">experience</label>
         <input type="range" name="" id="" main="0" max="10" step="1">
         <br>
         <br>
<label for="" required>address</label>
<textarea name="" id="" cols="50" rows="8" minlength="10" maxlength="20"></textarea>
    </form>

    input type="metre" name="" id="">
    </fieldset>

</body>
</html>

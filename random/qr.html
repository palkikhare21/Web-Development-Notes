<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oops 👀</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff4f6;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .card {
            background: white;
            width: 330px;
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #444;
        }

        img {
            width: 200px;
            margin: 15px 0;
        }

        .final {
            font-size: 18px;
            font-weight: bold;
            color: #555;
        }

        .bye {
            font-size: 15px;
            color: #888;
        }

        .heart {
            font-size: 25px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>⚠️ WARNING ⚠️</h1>

        <p>
            You have successfully scanned a completely unnecessary QR code. 👀
        </p>

        <p>
            Unfortunately, there's no prize. 🥲
        </p>

        <img src="bear.png" alt="Cute bear">

        <p class="final">
            Except this: <span class="heart">🫶🏻</span>
        </p>

        <p class="bye">
            Have a good day, idiot :)
        </p>

    </div>
     <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://drive.google.com/file/d/1E15HCY_9hbR5Gb0AreuYEbkccjpf5Q0K/view?usp=sharing" alt="">

</body>
</html>
